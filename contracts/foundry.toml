[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.36"
evm_version = "prague"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 128
# A handler that reverts would hide the property it was meant to check, so any revert fails the run.
fail_on_revert = true

[profile.ci.fuzz]
runs = 5000

[profile.ci.invariant]
runs = 512
depth = 256
